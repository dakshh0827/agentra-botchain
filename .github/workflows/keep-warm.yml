name: Keep services warm

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping backend + agents
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || vars.BACKEND }}
          SEO_URL: ${{ vars.SEO_AGENT_URL || 'https://agentra-seo.onrender.com' }}
          RESEARCH_URL: ${{ vars.RESEARCH_AGENT_URL || 'https://agentra-research.onrender.com' }}
          CONTENT_URL: ${{ vars.CONTENT_AGENT_URL || 'https://agentra-content.onrender.com' }}
        run: |
          set -u
          failed=0

          ping_url() {
            local label="$1"
            local url="$2"
            echo "::group::${label} → ${url}"
            local code="000"
            for attempt in 1 2 3; do
              code=$(curl --silent --show-error --location \
                          --max-time 90 --output /dev/null --write-out '%{http_code}' \
                          "$url" || echo "000")
              echo "attempt ${attempt}: HTTP ${code}"
              if [ "$code" = "200" ] || [ "$code" = "204" ]; then
                echo "awake"
                echo "::endgroup::"
                return 0
              fi
              [ "$attempt" -lt 3 ] && sleep 12
            done
            echo "::warning::${label} did not answer 200 (last HTTP ${code})"
            echo "::endgroup::"
            return 1
          }

          if [ -z "${BACKEND_URL:-}" ]; then
            echo "::warning::BACKEND_URL / BACKEND repo variable is not set — backend warm skipped."
          else
            base="${BACKEND_URL%/}"
            # Liveness only — cheap.
            ping_url "backend-healthz" "${base}/healthz" || failed=1
            # Touches Mongo / real API path the Explorer uses.
            ping_url "backend-analytics" "${base}/api/analytics/global" || failed=1
            ping_url "backend-agents" "${base}/api/agents?limit=1&sortBy=newest" || failed=1
          fi

          # First-party agents sleep independently of the API.
          if [ -n "${SEO_URL:-}" ]; then
            ping_url "agentra-seo" "${SEO_URL%/}/health" || failed=1
          fi
          if [ -n "${RESEARCH_URL:-}" ]; then
            ping_url "agentra-research" "${RESEARCH_URL%/}/health" || failed=1
          fi
          if [ -n "${CONTENT_URL:-}" ]; then
            ping_url "agentra-content" "${CONTENT_URL%/}/health" || failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            echo "::warning::One or more warm targets stayed cold"
            exit 1
          fi
          echo "All warm targets answered OK"
